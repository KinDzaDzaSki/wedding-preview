<body data-previous="wishes.html" data-next="thank-you.html">
  <main class="page page--forest">
    <div class="page-grain" aria-hidden="true"></div>

    <div class="page-content">
      <p class="eyebrow reveal">Те очекуваме</p>
      <h1 class="section-title section-title--compact reveal reveal-delay-1">Потврдете го вашето присуство</h1>
      <p class="rsvp-deadline reveal reveal-delay-2">Ве молиме потврдете до 1 мај 2027</p>

      <form class="rsvp-form reveal reveal-delay-2" data-rsvp-form novalidate>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="ime">Име</label>
            <input
              class="form-input"
              id="ime"
              name="ime"
              type="text"
              placeholder="Име"
              autocomplete="given-name"
              required
            >
          </div>

          <div class="form-group">
            <label class="form-label" for="prezime">Презиме</label>
            <input
              class="form-input"
              id="prezime"
              name="prezime"
              type="text"
              placeholder="Презиме"
              autocomplete="family-name"
              required
            >
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="attendance">Дали ќе присуствувате?</label>
          <select class="form-select" id="attendance" name="attendance" required>
            <option value="">Изберете одговор</option>
            <option value="yes">Со задоволство доаѓам</option>
            <option value="no">За жал, не можам</option>
          </select>
        </div>

        <div class="form-group" data-guests-group>
          <label class="form-label" for="guests">Број на гости</label>
          <select class="form-select" id="guests" name="guests" aria-describedby="guests-hint">
            <option value="1">1 гостин</option>
            <option value="2">2 гости</option>
            <option value="3">3 гости</option>
            <option value="4">4 гости</option>
            <option value="5">5 гости</option>
            <option value="6">6 гости</option>
          </select>
          <p class="form-hint" id="guests-hint">Вклучувајќи Ве и Вас.</p>
        </div>

        <div class="form-group">
          <label class="form-label" for="message">Порака за младенците</label>
          <textarea
            class="form-textarea"
            id="message"
            name="message"
            placeholder="Оставете ни порака…"
          ></textarea>
        </div>

        <button class="button button--filled" type="submit">Испратете ја потврдата</button>

        <p class="form-message" data-form-message role="status" aria-live="polite"></p>
        <p class="form-hint">Вашите податоци се користат само за организација на настанот.</p>
      </form>
    </div>

  <button class="music-toggle" type="button" data-music-toggle aria-pressed="false" aria-label="Пушти музика во позадина">♪</button>
  <audio data-music-loop loop preload="none" src="audio/ambient.mp3"></audio>
    <nav class="page-nav" aria-label="Навигација низ поканата">
      <a class="page-nav-button" href="wishes.html" data-go-previous aria-label="Претходна страница: Честитки">↑</a>
      <div class="page-progress" data-page-progress="9"></div>
      <a class="page-nav-button" href="thank-you.html" data-go-next aria-label="Следна страница: Ви благодариме">↓</a>
    </nav>
  </main>

  <script defer src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
  <script src="js/config.js?v=4"></script>
  <script defer src="js/main.js?v=4"></script>
</body>
</html>
