<body class="envelope-page" data-next="countdown.html">
  <section class="wax-scroll-cover" data-envelope-cover aria-label="Свадбена покана со восочен печат">
    <div class="wax-scroll-ambient" aria-hidden="true"></div>
    <div class="wax-scroll-dust" aria-hidden="true"></div>

    <div class="wax-scroll" data-envelope>
      <div class="wax-envelope" data-wax-envelope>
        <div class="wax-envelope-back" aria-hidden="true"></div>
        <div class="wax-envelope-inner" aria-hidden="true"></div>

        <div class="wax-envelope-flap" data-wax-envelope-flap aria-hidden="true">
          <div class="wax-envelope-flap-face wax-envelope-flap-face--front"></div>
          <div class="wax-envelope-flap-face wax-envelope-flap-face--back"></div>
        </div>

        <div class="wax-envelope-fold wax-envelope-fold--left" aria-hidden="true"></div>
        <div class="wax-envelope-fold wax-envelope-fold--right" aria-hidden="true"></div>
        <div class="wax-envelope-fold wax-envelope-fold--bottom" aria-hidden="true"></div>

        <button
          class="wax-envelope-seal"
          type="button"
          data-envelope-trigger
          aria-label="Отворете ја свадбената покана"
          aria-expanded="false"
        >
          <span class="wax-scroll-seal-ring" aria-hidden="true">
            <span class="wax-scroll-seal-emblem ampersand">Р&amp;Д</span>
          </span>
        </button>

        <p class="wax-scroll-prompt" aria-hidden="true">Допрете за да отворите</p>
      </div>

      <div class="wax-scroll-interior" data-scroll-interior aria-hidden="true" inert>
        <article class="wax-scroll-parchment">
          <header class="wax-scroll-header">
            <div class="wax-scroll-names" aria-label="Ружица и Дамјан">
              <span>Ружица</span>
              <i class="fam">&amp;</i>
              <span>Дамјан</span>
            </div>
            <p class="wax-scroll-date">сабота, 15 мај 2027</p>
            <p class="wax-scroll-venue">Скопје · Македонија</p>
          </header>

          <div class="wax-scroll-divider" aria-hidden="true"><span></span><i>◆</i><span></span></div>

          <p class="wax-scroll-message">
            Со огромна чест и задоволство ве покануваме да бидете дел од нашиот посебен ден.
          </p>

          <button class="button button--filled" type="button" data-view-invitation>
            Отворете ја поканата
          </button>
        </article>
      </div>
    </div>
  </section>

  <script defer src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
  <script defer src="js/main.js"></script>
</body>
</html>
