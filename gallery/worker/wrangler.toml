name = "wedding-gallery"
main = "src/index.js"
compatibility_date = "2026-10-06"

# Photos live in a plain R2 bucket — no KV, no D1. Metadata rides along in
# each object's customMetadata, so there is no second store to keep in sync.
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "wedding-photos"

[vars]
# Comma-separated origins allowed to call the API from a browser.
# Add your Pages origin, e.g. "https://kindzadzaski.github.io,http://localhost:8000"
ALLOWED_ORIGINS = "*"

# The admin token is NOT set here — it is a secret:
#   wrangler secret put ADMIN_TOKEN
#
# Local development (uses the same value):
#   echo 'ADMIN_TOKEN="dev-token"' > .dev.vars
