  <meta name="description" content="Честитки и желби за Ружица и Дамјан — напишете и прочитајте што велат гостите.">

  <meta property="og:title" content="Честитки | Ружица и Дамјан">
  <meta property="og:description" content="Оставете желба за младенците и прочитајте ги честитките на другите гости.">

  <meta property="og:image" content="https://kindzadzaski.github.io/wedding-preview/assets/og-image.png">

  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://kindzadzaski.github.io/wedding-preview/wishes.html">
  <title>Честитки | Ружица и Дамјан</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20fill='%23512732'/%3E%3Ccircle%20cx='16'%20cy='16'%20r='10.5'%20fill='none'%20stroke='%23f3ede1'%20stroke-width='1.25'/%3E%3Cpath%20d='M16%2010.5%20l4%205.5%20-4%205.5%20-4%20-5.5%20z'%20fill='%23f3ede1'/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="css/styles.css?v=4">
</head>

<body data-previous="gallery.html" data-next="rsvp.html">
  <main class="page page--parchment">
    <div class="page-grain" aria-hidden="true"></div>

    <div class="page-content" data-wishes>
      <p class="eyebrow reveal">Збор што останува</p>
      <h1 class="section-title reveal reveal-delay-1">Честитки</h1>

      <p class="body-copy reveal reveal-delay-2">
        Оставете желба за младенците — ќе ги читаме сите, една по една.
      </p>

      <form class="rsvp-form wish-form reveal reveal-delay-2" data-wish-form novalidate>
        <div class="form-group">
          <label class="form-label" for="wish-name">Вашето име</label>
          <input
            class="form-input"
            id="wish-name"
            name="name"
            type="text"
            placeholder="Име"
            autocomplete="name"
            maxlength="40"
            required
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="wish-message">Вашата желба</label>
          <textarea
            class="form-textarea"
            id="wish-message"
            name="message"
            placeholder="Напишете желба…"
            maxlength="300"
            required
          ></textarea>
          <div class="wish-form-row">
            <button class="wish-suggest" type="button" data-wish-suggest>Предлог за честитка</button>
            <span class="form-hint" data-wish-count>0 / 300</span>
          </div>
        </div>

        <button class="button button--filled" type="submit">Испрати желба</button>
        <p class="form-message" data-wish-message-status role="status" aria-live="polite"></p>
      </form>

      <div class="rule reveal reveal-delay-3" aria-hidden="true"><i>◆</i></div>

      <ul class="wish-grid" data-wish-list aria-live="polite">
        <li class="wish-empty" data-wish-empty>Сè уште нема желби — напишете ја првата.</li>
      </ul>
    </div>

    <button class="music-toggle" type="button" data-music-toggle aria-pressed="false" aria-label="Пушти музика во позадина">♪</button>
    <audio data-music-loop loop preload="none" src="audio/ambient.mp3"></audio>

    <nav class="page-nav" aria-label="Навигација низ поканата">
      <a class="page-nav-button" href="gallery.html" data-go-previous aria-label="Претходна страница: Галерија">↑</a>
      <div class="page-progress" data-page-progress="8"></div>
      <a class="page-nav-button" href="rsvp.html" data-go-next aria-label="Следна страница: Потврда на присуство">↓</a>
    </nav>
  </main>

  <script defer src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
  <script src="js/config.js?v=4"></script>
  <script defer src="js/main.js?v=4"></script>
</body>
</html>
